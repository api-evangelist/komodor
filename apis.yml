aid: komodor
name: Komodor
description: >-
  Komodor is an autonomous AI SRE platform for Kubernetes observability,
  troubleshooting, and operations across multiple clusters. The platform
  surfaces cluster events, deployment timelines, dependency maps, and
  remediation runbooks to help platform and SRE teams diagnose incidents
  faster. Komodor exposes a REST API plus a Terraform provider for managing
  clusters, services, monitors, and policies, authenticated with API keys
  generated from the User Settings page.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Kubernetes
  - Observability
  - SRE
  - Troubleshooting
  - DevOps
  - Cloud Native
